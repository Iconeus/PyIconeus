[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyiconeus"
dynamic = ["version"]
description = "Read Iconeus scan, positioning, ROI and IQ data formats."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
keywords = [
  "ultrasound",
  "functional-ultrasound",
  "fUS",
  "IcoScan",
  "HDF5",
  "medical-imaging",
  "neuroimaging",
  "bioimaging",
]
authors = [
  { name = "Iconeus" , email = "iconeus-dev@iconeus.com"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
 "numpy>=1.23",
 "pytz>=2022.1",
 "h5py>=3.8",
 "transforms3d>=0.4.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "requests",
  "tqdm",
  "coverage",
]
dev = [
  "ruff>=0.15",
  "mypy>=1.0.0",
]
example = [
  "matplotlib",
  "scipy",
  "ipywidgets",
  "ipympl",
]
doc = [
  "sphinx",
  "sphinx-book-theme",
]

[project.urls]
Issues = "https://github.com/Iconeus/pyiconeus/issues"
Source = "https://github.com/Iconeus/pyiconeus"

[tool.hatch.version]
path = "src/pyiconeus/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/pyiconeus tests}"

[tool.coverage.run]
source_pkgs = ["pyiconeus", "tests"]
branch = true
parallel = true
omit = [
  "src/pyiconeus/__about__.py",
]

[tool.coverage.paths]
pyiconeus = ["src/pyiconeus", "*/pyiconeus/src/pyiconeus"]
tests = ["tests", "*/pyiconeus/tests"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = "coverage report --fail-under=90"
