name: Lint

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master", "dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" "mypy>=1.0"
      - name: Run Ruff lint
        run: ruff check .
      - name: Check Ruff formatting
        run: ruff format --check .
      - name: Run type check
        run: mypy --install-types --non-interactive src/pyiconeus tests
